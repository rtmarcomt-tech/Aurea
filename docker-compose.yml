services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurea
      POSTGRES_PASSWORD: aurea
      POSTGRES_DB: aurea
    ports:
      - "5432:5432"
    volumes:
      - aurea_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurea -d aurea"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  aurea_postgres:
